services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MYSQL_DATABASE: computer_store
      # Local development: PHP runs on the host and connects through Docker NAT.
      MYSQL_ROOT_HOST: "%"
    entrypoint:
      - /bin/sh
      - -ec
      - ': "$${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}"; export MYSQL_ROOT_PASSWORD="$${DB_PASSWORD}"; exec docker-entrypoint.sh "$$@"'
      - --
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${DB_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u root --silent --skip-column-names -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
